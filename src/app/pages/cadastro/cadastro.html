<app-menu></app-menu>

<main class="cadastro-page container">
  <section class="introducao">
    <span>Crie sua conta</span>
    <h1>Faça parte da rede que conecta pessoas e animais.</h1>
    <p>Com uma conta você pode publicar animais para adoção e compartilhar ações da comunidade.</p>
    <div class="beneficios">
      <div>✓ Publicar pets para adoção</div>
      <div>✓ Compartilhar ações de ONGs</div>
      <div>✓ Participar da comunidade</div>
    </div>
  </section>

  <section class="card-cadastro">
    <h2>Cadastro</h2>
    <form (ngSubmit)="cadastrar()">
      <div class="campo">
        <label for="nome">Nome</label>
        <input id="nome" name="nome" [(ngModel)]="nome" placeholder="Seu nome completo">
      </div>

      <div class="campo">
        <label for="email">E-mail</label>
        <input id="email" type="email" name="email" [(ngModel)]="email" placeholder="seuemail@exemplo.com">
      </div>

      <div class="duas-colunas">
        <div class="campo">
          <label for="senha">Senha</label>
          <input id="senha" type="password" name="senha" [(ngModel)]="senha" placeholder="Mínimo 6 caracteres">
        </div>
        <div class="campo">
          <label for="confirmar">Confirmar senha</label>
          <input id="confirmar" type="password" name="confirmar" [(ngModel)]="confirmarSenha" placeholder="Repita a senha">
        </div>
      </div>

      <label class="lgpd">
        <input type="checkbox" name="lgpd" [(ngModel)]="aceitouLgpd">
        <span>Li e concordo com a <a routerLink="/privacidade">Política de Privacidade</a> e com o tratamento dos dados para este protótipo acadêmico.</span>
      </label>

      <p class="mensagem-erro" *ngIf="mensagemErro">{{ mensagemErro }}</p>
      <button class="botao" type="submit">Criar conta</button>
    </form>

    <p class="entrar">Já possui conta? <a routerLink="/login">Entrar</a></p>
  </section>
</main>
