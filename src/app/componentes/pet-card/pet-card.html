<article class="card-pet">
  <img [src]="pet.imagem" [alt]="pet.nome">
  <div class="conteudo">
    <div class="titulo">
      <h3>{{ pet.nome }}</h3>
      <span>{{ pet.especie }}</span>
    </div>
    <p class="local">📍 {{ pet.bairro }} · {{ pet.idade }} · {{ pet.porte }}</p>
    <p>{{ pet.descricao }}</p>

    <div class="tags">
      <span *ngFor="let item of pet.compatibilidade">{{ item }}</span>
    </div>

    <button type="button" (click)="demonstrarInteresse()">
      {{ interessado ? 'Interesse registrado ✓' : 'Tenho interesse em adotar' }}
    </button>
  </div>
</article>
